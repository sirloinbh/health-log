services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health}
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:15403:5432']
    volumes:
      - health-log-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: backend/Dockerfile, secrets: [npm_token] }
    # Tagged by commit on the server so the previous version can be restarted (#74).
    image: health-backend:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-health}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-health}
      PORT: 3103
      TZ: Asia/Seoul
      # #167: the shared sign-in (sirloinbh/shared-auth) checks each /api session on its network.
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://shared-auth-api:3110}
      # shared-ai's public key; /internal/tools is served only when it is set (project-standards docs/ai-tools.md).
      AI_TOOLS_PUBLIC_KEY: ${AI_TOOLS_PUBLIC_KEY:-}
      # #333: the daily screen reads a day's workouts from workout-memo (read-only, with the user's session cookie) on the
      # shared-ai network, where its api has the alias workout-memo-api. Empty: the screen says workout-memo cannot be reached.
      WORKOUT_MEMO_URL: ${WORKOUT_MEMO_URL:-http://workout-memo-api:3101}
      # #118: the Public Data Portal key for the MFDS food lookup, read from SSM on deploy. Empty: the lookup is off.
      FOOD_NTR_SERVICE_KEY: ${FOOD_NTR_SERVICE_KEY:-}
    networks:
      default: {}
      shared-auth: {}
      # shared-ai reads this app's tools at http://health-log-api:3103/internal/tools (ADR-0017).
      shared-ai: { aliases: [health-log-api] }
    depends_on:
      db: { condition: service_healthy }
    # The image has no curl, so node asks the API itself. `docker compose up -d --wait` and web's depends_on use it (#894).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3103/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: frontend/Dockerfile, secrets: [npm_token] }
    image: health-frontend:${IMAGE_TAG:-local}
    # 127.0.0.1:8103 locally and on the server: only the shared HTTPS proxy reaches the web (#74).
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8103}:80']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  health-log-data:
# Created by the shared-auth compose project. Locally, run shared-auth first, or once: docker network create shared-auth
networks:
  shared-auth:
    external: true
  # Created by deploy/remote-deploy.sh or the shared-ai deploy when missing. Locally, once: docker network create shared-ai
  shared-ai:
    name: shared-ai
    external: true
# The Dockerfiles read the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
